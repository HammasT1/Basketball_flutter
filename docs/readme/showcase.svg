<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Dunk meter charging to DUNK, streak growing to ON FIRE 2X, and the ball cycling through shop skins.">
  <defs>
    <linearGradient id="fire" x1="0" x2="1">
      <stop offset="0" stop-color="#FFC107"/>
      <stop offset="0.5" stop-color="#FF5722"/>
      <stop offset="1" stop-color="#F44336"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <style>
    .card  { fill: #141414; stroke: #2A2A2A; stroke-width: 2; }
    .label { font: 800 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #FFFFFF; text-anchor: middle; }
    .hint  { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; fill: #9E9E9E; text-anchor: middle; }
    .led   { font: 700 22px 'Courier New', Consolas, monospace; fill: #FFFFFF; text-anchor: middle; }
    .badge { font: 800 17px 'Courier New', Consolas, monospace; fill: #FFFFFF; text-anchor: middle; letter-spacing: 1px; }
  </style>

  <!-- ============ 1. DUNK POWER-UP ============ -->
  <rect x="6" y="6" width="376" height="258" rx="18" class="card"/>
  <circle cx="194" cy="104" r="62" fill="#FF5722" opacity="0" filter="url(#soft)">
    <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;0.8" keyTimes="0;0.75"/>
  </circle>
  <circle cx="194" cy="104" r="58" fill="none" stroke="#2E2E2E" stroke-width="9"/>
  <circle cx="194" cy="104" r="58" fill="none" stroke="#FF5722" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="364.4" stroke-dashoffset="364.4" transform="rotate(-90 194 104)">
    <animate attributeName="stroke-dashoffset" dur="4.8s" repeatCount="indefinite"
             values="364.4;364.4;243;243;121.5;121.5;0;0" keyTimes="0;0.15;0.25;0.4;0.5;0.65;0.75;1"/>
    <animate attributeName="stroke" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="#FF9800;#FFD740" keyTimes="0;0.75"/>
  </circle>
  <circle cx="194" cy="104" r="46" stroke="#000" stroke-width="4" fill="#616161">
    <animate attributeName="fill" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="#616161;#FF5722" keyTimes="0;0.75"/>
  </circle>
  <text x="194" y="112" class="led" opacity="1"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.25"/>0/3</text>
  <text x="194" y="112" class="led" opacity="0"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.5"/>1/3</text>
  <text x="194" y="112" class="led" opacity="0"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.75"/>2/3</text>
  <text x="194" y="112" class="led" opacity="0"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.75"/>DUNK!</text>
  <text x="194" y="210" class="label">DUNK POWER-UP</text>
  <text x="194" y="236" class="hint">3 swiped baskets charge one dunk</text>

  <!-- ============ 2. STREAKS & ON FIRE ============ -->
  <rect x="412" y="6" width="376" height="258" rx="18" class="card"/>
  <!-- basket dots -->
  <g>
    <circle cx="560" cy="58" r="11" fill="#2E2E2E"><animate attributeName="fill" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="#2E2E2E;#FF5722" keyTimes="0;0.15"/></circle>
    <circle cx="600" cy="58" r="11" fill="#2E2E2E"><animate attributeName="fill" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="#2E2E2E;#FF5722" keyTimes="0;0.35"/></circle>
    <circle cx="640" cy="58" r="11" fill="#2E2E2E"><animate attributeName="fill" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="#2E2E2E;#FFD740" keyTimes="0;0.55"/></circle>
  </g>
  <!-- streak badge -->
  <g opacity="1">
    <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.15;0.55"/>
    <rect x="510" y="96" width="180" height="40" rx="20" fill="#000" fill-opacity="0.7" stroke="#3A3A3A"/>
    <text x="600" y="122" class="badge" opacity="0"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.15;0.35"/>STREAK x1</text>
    <text x="600" y="122" class="badge" opacity="0"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.35;0.55"/>STREAK x2</text>
  </g>
  <!-- on fire badge -->
  <g opacity="0">
    <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.55"/>
    <rect x="490" y="90" width="220" height="52" rx="26" fill="#FF5722" filter="url(#soft)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="96" width="200" height="40" rx="20" fill="url(#fire)" stroke="#000" stroke-width="2"/>
    <text x="600" y="122" class="badge">ON FIRE 2X</text>
    <!-- rising embers -->
    <g fill="#FFD740">
      <circle cx="540" cy="150" r="3"><animate attributeName="cy" values="150;170;150" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="158" r="4"><animate attributeName="cy" values="160;180;160" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="150" r="3"><animate attributeName="cy" values="150;172;150" dur="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="600" y="210" class="label">STREAKS &amp; ON FIRE</text>
  <text x="600" y="236" class="hint">3 in a row = double points until you miss</text>

  <!-- ============ 3. SHOP & SKINS ============ -->
  <rect x="818" y="6" width="376" height="258" rx="18" class="card"/>
  <!-- ball cycling through skins -->
  <g transform="translate(960 102)">
    <circle r="52" fill="#E64A19">
      <animate attributeName="fill" dur="6s" repeatCount="indefinite" calcMode="discrete"
               values="#E64A19;#29B6F6;#76FF03;#7C4DFF;#E53935;#FFD600" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </circle>
    <circle r="52" fill="url(#shade)"/>
    <g stroke="#1A1A1A" stroke-width="3" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <path d="M -52 0 H 52"/>
      <path d="M 0 -52 V 52"/>
      <path d="M -36 -36 Q 0 0 -36 36"/>
      <path d="M 36 -36 Q 0 0 36 36"/>
    </g>
  </g>
  <!-- coin -->
  <g transform="translate(1080 80)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="1.2s" repeatCount="indefinite"/>
      <circle r="22" fill="#FFC107" stroke="#FF8F00" stroke-width="4"/>
      <circle r="12" fill="none" stroke="#FF8F00" stroke-width="3"/>
    </g>
  </g>
  <text x="1080" y="140" class="led" style="fill:#FFC107;font-size:18px">+ COINS</text>
  <text x="1006" y="210" class="label">SHOP &amp; SKINS</text>
  <text x="1006" y="236" class="hint">6 ball skins · 6 court themes</text>
</svg>
