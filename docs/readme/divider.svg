<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#FF5722" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF5722" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF5722" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#FFD740" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD740"/>
      <stop offset="1" stop-color="#FFD740" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="5" width="1200" height="2" rx="1" fill="url(#base)"/>
  <rect y="4" width="220" height="4" rx="2" fill="url(#spark)">
    <animate attributeName="x" from="-220" to="1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
