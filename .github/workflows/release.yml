name: Release

# Runs when a version tag such as v1.0.0 is pushed. Builds the app and
# publishes a GitHub Release with the APK and the web build attached.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          echo "Tag: $TAG_VERSION  pubspec: $PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pubspec.yaml version $PUBSPEC_VERSION. Update 'version:' in pubspec.yaml first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Note: android/app/build.gradle signs release builds with the debug key.
      # Fine for sharing/testing; set up a real keystore before publishing to
      # the Play Store.
      - name: Build release APK
        run: flutter build apk --release

      - name: Build web
        run: flutter build web --release --no-wasm-dry-run

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/basketball-${GITHUB_REF_NAME}.apk"
          (cd build/web && zip -r "../../dist/basketball-${GITHUB_REF_NAME}-web.zip" .)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Basketball ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/basketball-${{ github.ref_name }}.apk
            dist/basketball-${{ github.ref_name }}-web.zip
