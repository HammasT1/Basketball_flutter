allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Some older plugins don't declare a namespace, which AGP 8+ requires.
// Fall back to the plugin's package (Flutter sets `group` to match the
// AndroidManifest.xml package for plugin subprojects). Must run before
// evaluationDependsOn forces early evaluation below.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
        // Some plugins don't set a Kotlin jvmTarget, so it defaults to the JDK
        // running Gradle, which conflicts with their Java compileOptions. Make
        // Kotlin target the same Java version each module compiles Java for.
        // (The app module sets its own jvmTarget in app/build.gradle.)
        if (project.plugins.hasPlugin("com.android.library")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    // read lazily: compileOptions is only final once tasks are configured
                    jvmTarget = project.android.compileOptions.targetCompatibility.toString()
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
